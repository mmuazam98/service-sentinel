# Test workloads for verifying Kubernetes probe discovery locally.
# Apply against a kind cluster ONLY:
#   kubectl --context kind-sentinel-test apply -f deploy/testdata/probe-workloads.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-demo
---
# A healthy pod: nginx with a readiness probe on / and a liveness probe.
# Discovery should find it and every check should report Healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: sentinel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http          # named port, exercises port resolution
          livenessProbe:
            httpGet:
              path: /
              port: 80            # numeric port
---
# A pod whose probe path returns 404. Kubernetes itself will mark it
# NotReady, and Service Sentinel should report it Unhealthy (Status: 404).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
  namespace: sentinel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-app
  template:
    metadata:
      labels:
        app: broken-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /this-path-does-not-exist
              port: 80
            # Keep the container alive long enough to be discovered; only
            # readiness fails, so the pod stays Running.
            failureThreshold: 100
---
# An exec probe, which has no HTTP endpoint. Discovery must skip it
# rather than crash or invent a URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exec-probe-app
  namespace: sentinel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exec-probe-app
  template:
    metadata:
      labels:
        app: exec-probe-app
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sleep", "3600"]
          readinessProbe:
            exec:
              command: ["true"]
